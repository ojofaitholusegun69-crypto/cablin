<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .wrap{width:1100px;height:600px;display:flex;align-items:center;justify-content:center;background:#fff;}
  svg{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1550 560" xmlns="http://www.w3.org/2000/svg">
  <g fill="#0A0A0A">

    <!-- ================= ROOF (gable spanning b + l ascenders) ================= -->
    <polygon points="720,300 915,55 1110,300 1110,370 915,125 720,370" />

    <!-- ================= C ================= -->
    <path fill-rule="evenodd" d="
      M340,305 A155,155 0 1 0 30,305 A155,155 0 1 0 340,305 Z
      M270,305 A85,85 0 1 0 100,305 A85,85 0 1 0 270,305 Z" />
    <!-- knockout wedge to open the C -->
    <rect x="185" y="235" width="220" height="140" fill="#fff" />

    <!-- ================= a ================= -->
    <path fill-rule="evenodd" d="
      M660,370 A100,100 0 1 0 460,370 A100,100 0 1 0 660,370 Z
      M605,370 A45,45 0 1 0 515,370 A45,45 0 1 0 605,370 Z" />
    <rect x="650" y="280" width="70" height="180" rx="16" />

    <!-- ================= b ================= -->
    <rect x="770" y="300" width="70" height="160" rx="16" />
    <path fill-rule="evenodd" d="
      M1030,370 A100,100 0 1 0 830,370 A100,100 0 1 0 1030,370 Z
      M975,370 A45,45 0 1 0 885,370 A45,45 0 1 0 975,370 Z" />

    <!-- ================= l ================= -->
    <rect x="1015" y="300" width="70" height="160" rx="16" />

    <!-- ================= i ================= -->
    <rect x="1130" y="280" width="66" height="180" rx="16" />
    <circle cx="1163" cy="210" r="42" />

    <!-- ================= n ================= -->
    <rect x="1250" y="280" width="70" height="180" rx="16" />
    <rect x="1420" y="280" width="70" height="180" rx="16" />
    <rect x="1250" y="220" width="240" height="90" rx="45" />

  </g>
</svg>
</div>
</body>
</html>
